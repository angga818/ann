server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip untuk teks & font
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # Asset hasil Vite memakai hash — cache permanen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache agar update terlihat langsung
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA (aman untuk HashRouter maupun BrowserRouter)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jangan bocorkan versi server
    server_tokens off;
}
